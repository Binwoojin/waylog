spring:
  config:
    # 실행 디렉터리(backend/)의 .env를 properties 형식으로 읽습니다.
    # 파일이 없어도 기동되도록 optional로 둡니다. (.env는 git에서 무시됩니다)
    import: optional:file:.env[.properties]
  cache:
    type: caffeine
    cache-names:
      - tourLists
      - homeTours
      - recommendedCourses
      - tourCourseIntro
      - tourCourseDetails
      - tourRegions
      - tourDistricts
    caffeine:
      # TourAPI 개발계정의 일일 1,000회 제한을 보호하기 위해
      # 동일 조건의 조회 결과를 1시간 동안 재사용합니다.
      spec: maximumSize=1000,expireAfterWrite=1h
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PW}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
    auth-code-expiration-millis: 180000  # 30 * 60 * 100 == 3분
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PW}
#    url: ${secrets.DB_URL}
#    username: ${secrets.DB_USER}
#    password: ${secrets.DB_PW}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
  application:
    name: travel_korea
  web:
    error:
      # 운영 기본값: 에러 응답에 Java 스택트레이스(trace)를 포함하지 않습니다.
      # spring-boot-devtools(로컬 실행 시)는 spring.web.error.include-stacktrace=always 를
      # 기본값으로 주입하므로, 이 설정이 그 기본값을 덮어씁니다.
      include-stacktrace: never
      # 같은 이유로 include-message / include-binding-errors 도 devtools 기본값(always)을 덮어씁니다.
      # 내부 예외 문구(Jackson 파싱 상세, NPE 메시지 등)가 응답 message로 새지 않게 합니다.
      # GlobalExceptionHandler가 직접 만든 응답 본문의 message(한글 문구)는 이 설정과 무관합니다.
      include-message: never
      include-binding-errors: never
server:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB
  port: ${SERVER_PORT}
jwt:
  secret: ${JWT_SECRET}
  access-expiration: 1800000       # 30분 (1000 * 60 * 30)
  refresh-expiration: 604800000    # 7일 (1000 * 60 * 60 * 24 * 7)
#tour-api-key: ${TOUR_API}
tour-api:
  base-url: https://apis.data.go.kr/B551011/KorService2
  service-key: ${TOUR_API}
  mobile-os: ETC
  mobile-app: WayLog
  connect-timeout: 5s
  read-timeout: 10s
app:
  cors:
    frontend-origin: ${FRONTEND_ORIGEN}
  upload:
    max-image-count: 5
  storage:
    type: ${STORAGE_TYPE}
  max-file-size-byte: 10485760
  s3:
    bucket: ${S3_BUCKET}
    region: ${AWS_REGION}
    presigned-url-minutes: 15