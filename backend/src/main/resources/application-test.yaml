server:
  port: 0

jwt:
  secret: dGVzdC1vbmx5LWp3dC1zZWNyZXQtZm9yLWNvbnRleHQtbG9hZC10ZXN0cw==

spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:waylog-test;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  mail:
    host: localhost
    port: 3025
    username: test@example.com
    password: test-password
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
            required: false
          connectiontimeout: 1000
          timeout: 1000
          writetimeout: 1000
    auth-code-expiration-millis: 180000

# 테스트에서는 실제 TourAPI 서비스키를 사용하지 않습니다.
tour-api:
  base-url: https://apis.data.go.kr/B551011/KorService2
  service-key: test-tour-api-key
  mobile-os: ETC
  mobile-app: WayLog-Test
  connect-timeout: 3s
  read-timeout: 5s

app:
  cors:
    frontend-origin: http://localhost:5173
  storage:
    type: s3
  s3:
    bucket: test-bucket
    region: ap-northeast-2